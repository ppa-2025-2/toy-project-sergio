spring.application.name=ms-ticket

app.user.default.roles=ROLE_USER,ROLE_GUEST,ROLE_VIEWER

# Configurações JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

# Configuração para usar banco de dados SQLite:
spring.datasource.url=jdbc:sqlite:ticketsdb.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:ticketschema.sql
spring.sql.init.data-locations=classpath:ticketdata.sql

curso=tads
server.port=8081